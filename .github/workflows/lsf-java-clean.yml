name: LSF clean Java action security rebuild
on:
  push:
    branches: [fix/fastxml-20261113]
    paths: [.github/workflows/lsf-java-clean.yml]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: KirilsTurkins/lsf-checkout@4d310727149d3abacc52b5dcb0a1c4d18b345d13
        with:
          ref: 63c7977881fc344a6ed464f7ed5e242aedc8d56c
          persist-credentials: false
      - uses: KirilsTurkins/lsf-setup-node@4c54f99c80ce8343c6fc2b0e6516dc933ee39cb6
        with:
          node-version: 24.19.0
      - name: Acquire and authenticate the clean build driver
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 https://raw.githubusercontent.com/KirilsTurkins/latent-service-fabric/c2c6f6a4222e311427d67f1cbdd24fc665cbd582/tools/ci_action_security_refresh_20261113.py -o "$RUNNER_TEMP/action-refresh.py"
          echo "f925f337ee6847e35647b9a11273f5809c74aec82747ea0b680a7c2441ebdd45  $RUNNER_TEMP/action-refresh.py" | sha256sum --check --strict
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 90 https://raw.githubusercontent.com/KirilsTurkins/latent-service-fabric/6652cde1b7d471bcd6838d537f6e9a2b950b3a4e/tools/ci_security_refresh_adjustments.py -o "$RUNNER_TEMP/adjust.py"
          echo "4b9f3479a204fe06435b6b16bfe8e1ebec989054db5bcab63e93588079b3a7e7  $RUNNER_TEMP/adjust.py" | sha256sum --check --strict
          python "$RUNNER_TEMP/adjust.py" action "$RUNNER_TEMP/action-refresh.py"
          python - <<'PY'
          import pathlib,os,hashlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'action-refresh.py';s=p.read_text()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='df9e8e4c198f73da6ac2f8a5e395a6dc87e3164f6988e6e14a650e6008c2997e'
          s=s.replace("run('git','diff','--cached','--raw','--no-abbrev')", "run('git','diff','--cached','--raw','--no-abbrev','--no-renames')")
          s=s.replace("    scripts=manifest.get('scripts',{})", "    scripts=manifest.get('scripts',{})\n    if role in {'rust-cache', 'setup-java'}:\n        import shutil\n        shutil.rmtree(ROOT/'dist')")
          assert hashlib.sha256(s.encode()).hexdigest()=='ba133f137cc3fa08167c8ed62c102bfa64c37e17f88567fe6a39a7b674194840'
          p.write_text(s)
          PY
      - name: Rebuild from empty dist and execute the parser and existing tests
        run: python "$RUNNER_TEMP/action-refresh.py" prepare setup-java
      - name: Export exact validated code objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python "$RUNNER_TEMP/action-refresh.py" export setup-java
      - uses: KirilsTurkins/lsf-upload-artifact@06dfe2de8e406c74d8e62730bcd18c498d48549c
        if: always()
        with:
          name: action-security-setup-java-clean
          path: ${{ runner.temp }}/action-security-evidence/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error
